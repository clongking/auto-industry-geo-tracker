name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # astro.config.mjs 会读取 GITHUB_REPOSITORY（owner/repo）自动推导 site 与 base。
      # 如使用自定义域名，可在仓库 Variables 中设置 SITE_URL / BASE_PATH 覆盖。
      # SITE_PASSWORD 来自仓库 Secrets：postbuild 会用它加密 dist/ 下所有 HTML；
      # 在 Actions 中若为空，scripts/encrypt-dist.mjs 会直接让构建失败，防止误发布明文。
      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          SITE_REMEMBER_DAYS: ${{ vars.SITE_REMEMBER_DAYS }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
