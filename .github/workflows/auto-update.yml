name: Auto Update Reports and Deploy

on:
  # 每周四北京时间 18:00 = UTC 10:00
  schedule:
    - cron: '0 10 * * 4'
  # 允许通过 Actions 页面手动触发，也供网站"手动更新"按钮使用
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: auto-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research-and-build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install python-docx
        run: pip install python-docx

      - name: Install dependencies
        run: npm ci

      - name: Research and update content
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: node scripts/auto-update.mjs

      - name: Generate Word report
        run: node scripts/export-word.mjs

      - name: Commit updated reports
        run: |
          git config user.name "Cursor Agent"
          git config user.email "agent@cursor.local"
          git add content/ docs/
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "content: 自动采集更新 $(date -u +%F)"
            git push
          fi

      - name: Build site
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
